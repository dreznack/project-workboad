<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bridge Projects</title>
<style>
  :root{
    --navy:#12203B;
    --navy-2:#1B2E52;
    --steel:#4A5568;
    --paper:#ECEEEA;
    --paper-2:#F7F8F5;
    --line:#C7CDC6;
    --orange:#E1560F;
    --orange-dim:#F4E3D8;
    --green:#2F6B4F;
    --green-dim:#DCEBE2;
    --red:#A23B2E;
    --red-dim:#F3DEDA;
    --amber:#9C6B12;
    --amber-dim:#F1E4C9;
    --blue:#2A5DA8;
    --blue-dim:#DCE6F3;
    --ink:#171A1E;
    --display: 'Barlow Condensed', Arial Narrow, sans-serif;
    --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--body);background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent;}
  input,select,textarea,button{font-family:inherit;font-size:15px;}
  h1,h2,h3{font-family:var(--display);color:var(--navy);margin:0 0 8px 0;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:none;border-radius:5px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px;}
  .btn.secondary{background:var(--paper-2);color:var(--navy);border:1px solid var(--line);}
  .btn.danger{background:var(--red);}
  .btn.small{padding:7px 12px;font-size:12.5px;min-height:36px;}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);min-height:44px;
  }
  label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:var(--steel);margin-bottom:4px;}
  .field{margin-bottom:14px;}
  .tag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:3px;letter-spacing:0.3px;text-transform:uppercase;}
  .tag.green{background:var(--green-dim);color:var(--green);}
  .tag.red{background:var(--red-dim);color:var(--red);}
  .tag.amber{background:var(--amber-dim);color:var(--amber);}
  .tag.grey{background:var(--paper);color:var(--steel);}

  /* ---------- App shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  header.topbar .brand{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:0.3px;display:flex;align-items:center;gap:8px;}
  header.topbar .brand .n{background:var(--orange);border-radius:3px;padding:2px 7px;font-size:14px;}
  header.topbar .actions{display:flex;gap:8px;}
  header.topbar .actions button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.35);border-radius:5px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:38px;}

  main{flex:1;padding:20px;max-width:1200px;margin:0 auto;width:100%;padding-bottom:90px;}

  nav.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  nav.tabs .tab{padding:9px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--steel);background:var(--paper-2);border:1px solid var(--line);cursor:pointer;}
  nav.tabs .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  nav.tabs .tab.disabled{opacity:0.5;cursor:default;}

  /* Bottom tab bar for mobile */
  nav.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  nav.bottom-nav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--steel);cursor:pointer;}
  nav.bottom-nav .bn-item.active{color:var(--orange);}
  nav.bottom-nav .bn-item .ic{font-size:18px;}

  @media (max-width: 720px){
    main{padding:14px;padding-bottom:80px;}
    header.topbar{padding:12px 14px;}
    nav.bottom-nav{display:flex;}
  }

  /* ---------- Dashboard cards ---------- */
  .dash-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .proj-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .proj-card{background:var(--paper-2);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:6px;padding:16px 18px;cursor:pointer;transition:box-shadow 0.12s,border-color 0.12s;}
  .proj-card:hover{box-shadow:0 4px 14px rgba(18,32,59,0.12);border-left-color:var(--orange);}
  .proj-card .pnum{font-family:var(--mono);font-size:11px;color:var(--orange);letter-spacing:0.5px;}
  .proj-card .pname{font-family:var(--display);font-size:19px;font-weight:600;color:var(--navy);margin:2px 0 10px 0;}

  .days-remaining{display:flex;align-items:baseline;gap:6px;margin-bottom:10px;}
  .days-remaining .num{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;}
  .days-remaining .lbl{font-size:11.5px;color:var(--steel);text-transform:uppercase;letter-spacing:0.4px;}
  .days-remaining.green .num{color:var(--green);}
  .days-remaining.amber .num{color:var(--amber);}
  .days-remaining.red .num{color:var(--red);}

  .progress-row{margin-bottom:10px;}
  .progress-row .prlabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--steel);margin-bottom:4px;}
  .progress-row .prlabel strong{color:var(--ink);font-family:var(--mono);font-weight:600;}
  .progress-track{background:var(--paper);border-radius:20px;height:9px;overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;border-radius:20px;transition:width 0.2s;}
  .progress-fill.green{background:var(--green);}
  .progress-fill.amber{background:var(--amber);}
  .progress-fill.red{background:var(--red);}
  .progress-fill.blue{background:var(--blue);}

  .milestone-mini{font-size:11.5px;color:var(--steel);border-top:1px solid var(--line);margin-top:10px;padding-top:8px;}
  .milestone-mini strong{color:var(--ink);}

  /* ---------- Project detail ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:16px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:6px;padding:14px 16px;}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:0.4px;color:var(--steel);font-weight:600;}
  .kpi .value{font-family:var(--display);font-size:28px;font-weight:700;color:var(--navy);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--steel);border-bottom:2px solid var(--navy);padding:8px 10px;white-space:nowrap;}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .num{font-family:var(--mono);text-align:right;white-space:nowrap;}

  .grid.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:600px){ .grid.cols-2{grid-template-columns:1fr;} }

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(18,32,59,0.55);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;z-index:50;}
  .modal{background:#fff;border-radius:8px;max-width:600px;width:100%;padding:22px 24px;margin-top:24px;margin-bottom:24px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .milestone-row{display:grid;grid-template-columns:2fr 1.3fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;}
  @media (max-width:600px){ .milestone-row{grid-template-columns:1fr;} }

  /* ---------- Auth screens ---------- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:#fff;border-radius:8px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(18,32,59,0.15);}
  .auth-card h1{text-align:center;font-size:26px;margin-bottom:4px;}
  .auth-card .sub{text-align:center;color:var(--steel);font-size:13px;margin-bottom:20px;}
  .helptext{font-size:12px;color:var(--steel);margin-top:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==================== State & date helpers ==================== */
let state = { company:{name:'Your Company'}, projects:[] };
let stateVersion = 1;
let currentView = 'dashboard';
let currentProjectId = null;
let authStatus = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function isWeekend(d){ const day=d.getDay(); return day===0||day===6; }
function addCalendarDays(d, days){ const r=new Date(d); r.setDate(r.getDate()+Number(days||0)); return r; }
function addWorkingDays(startDate, days){
  let d = new Date(startDate); let count=0; days=Number(days||0);
  while(count<days){ d.setDate(d.getDate()+1); if(!isWeekend(d)) count++; }
  return d;
}
function calendarDaysBetween(from, to){ return Math.round((to-from)/(1000*60*60*24)); }
function workingDaysBetween(from, to){
  if(to<=from) return -calendarWorkingDaysBetween(to, from);
  let d = new Date(from); let count=0;
  while(d<to){ d.setDate(d.getDate()+1); if(!isWeekend(d)) count++; }
  return count;
}
function calendarWorkingDaysBetween(from, to){
  let d = new Date(from); let count=0;
  while(d<to){ d.setDate(d.getDate()+1); if(!isWeekend(d)) count++; }
  return count;
}
function todayMidnight(){ const t = new Date(); t.setHours(0,0,0,0); return t; }

// A schedule "target" (the overall contract, or an individual milestone) can be anchored
// off two different dates: Notice to Proceed (NTP) or the Actual Start date — since contracts
// sometimes count days from NTP and sometimes from when work actually began.
// type values:
//   'calendar-ntp'   - X calendar days from NTP
//   'working-ntp'    - X working days from NTP (skips weekends)
//   'calendar-start' - X calendar days from Actual Start
//   'working-start'  - X working days from Actual Start
//   'date'           - a single fixed target date
//   'range'          - (milestones only) a defined start date + stop date window
function normalizeType(type){
  // Backward-compat: earlier version only had NTP-anchored types under these names.
  if(type==='calendar') return 'calendar-ntp';
  if(type==='working') return 'working-ntp';
  return type || 'calendar-ntp';
}
function isWorkingType(type){ type = normalizeType(type); return type==='working-ntp' || type==='working-start'; }
function anchorDateFor(p, type){
  type = normalizeType(type);
  if(type==='calendar-start' || type==='working-start') return p.actualStartDate || p.ntpDate;
  return p.ntpDate;
}
function targetEndDate(p, type, value){
  type = normalizeType(type);
  if(type==='date') return new Date(value);
  const anchor = new Date(anchorDateFor(p, type));
  return isWorkingType(type) ? addWorkingDays(anchor, value) : addCalendarDays(anchor, value);
}
function daysRemaining(p, type, value){
  const end = targetEndDate(p, type, value);
  const today = todayMidnight();
  end.setHours(0,0,0,0);
  return isWorkingType(type) ? workingDaysBetween(today, end) : calendarDaysBetween(today, end);
}
function totalDuration(p, type, value){
  type = normalizeType(type);
  if(type==='date'){
    const anchor = new Date(anchorDateFor(p, type)); anchor.setHours(0,0,0,0);
    const end = new Date(value); end.setHours(0,0,0,0);
    return calendarDaysBetween(anchor, end);
  }
  return Number(value||0);
}
// Range milestones (start date + stop date) have their own status logic rather than a single
// "days remaining" number, since they can be upcoming, currently active, or already past.
function rangeStatus(m){
  const today = todayMidnight();
  const start = new Date(m.startDate); start.setHours(0,0,0,0);
  const end = new Date(m.endDate); end.setHours(0,0,0,0);
  if(today < start){
    const untilStart = calendarDaysBetween(today, start);
    return {phase:'upcoming', remaining: untilStart, label:`Starts in ${untilStart} days`, cls:'amber'};
  }
  if(today <= end){
    const untilEnd = calendarDaysBetween(today, end);
    return {phase:'active', remaining: untilEnd, label:`${untilEnd} days left (in progress)`, cls: scheduleStatusClass(untilEnd)};
  }
  const daysPast = calendarDaysBetween(end, today);
  return {phase:'past', remaining: -daysPast, label:`Ended ${daysPast} day${daysPast===1?'':'s'} ago`, cls:'grey'};
}
function scheduleStatusClass(remaining){
  if(remaining < 0) return 'red';
  if(remaining <= 14) return 'red';
  if(remaining <= 30) return 'amber';
  return 'green';
}
function scheduleTypeLabel(type){
  type = normalizeType(type);
  switch(type){
    case 'working-ntp': return 'Working Days (NTP)';
    case 'calendar-ntp': return 'Calendar Days (NTP)';
    case 'working-start': return 'Working Days (Actual Start)';
    case 'calendar-start': return 'Calendar Days (Actual Start)';
    case 'range': return 'Start/Stop Date Range';
    default: return 'Fixed Date';
  }
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
// Guards against a known <input type="date"> quirk: typing a 2-digit year quickly can get
// stored literally as year 0026 instead of 2026. Rather than just rejecting it, auto-correct
// any year under 100 to the 2000s — far more forgiving for phone/field entry than requiring
// the user to retype all 4 digits perfectly.
function normalizeDateValue(dateStr){
  if(!dateStr) return dateStr;
  const parts = String(dateStr).split('-');
  if(parts.length !== 3) return dateStr;
  let y = Number(parts[0]);
  if(y < 100) y += 2000;
  return String(y).padStart(4,'0') + '-' + parts[1] + '-' + parts[2];
}
function yearIsSane(dateStr){
  if(!dateStr) return true;
  const y = Number(String(dateStr).slice(0,4));
  return y >= 1990 && y <= 2100;
}

/* ==================== API ==================== */
async function api(path, opts){
  const res = await fetch('/api' + path, {
    credentials:'include',
    headers:{'Content-Type':'application/json'},
    ...opts,
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw Object.assign(new Error(data.error||'Request failed'), {status:res.status, data});
  return data;
}
async function loadState(){
  const r = await api('/state');
  state = r.data && r.data.projects ? r.data : { company:{name:'Your Company'}, projects:[] };
  stateVersion = r.version;
}
let saveTimer = null;
async function saveState(){
  try{
    const r = await api('/state', {method:'POST', body: JSON.stringify({data: state, expectedVersion: stateVersion})});
    stateVersion = r.version;
  }catch(e){
    if(e.status===409 && e.data && e.data.data){
      alert('Someone else saved changes since this page loaded. Reloading the latest version — please redo your last edit.');
      state = e.data.data; stateVersion = e.data.version; render();
    } else {
      console.error(e);
      alert('Could not save: ' + e.message);
    }
  }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }

/* ==================== Auth screens ==================== */
function renderAuthLoading(){
  document.getElementById('app').innerHTML = `<div class="auth-wrap"><div class="auth-card"><h1>Bridge Projects</h1><div class="sub">Loading…</div></div></div>`;
}
function renderSetup(){
  document.getElementById('app').innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <h1>Bridge Projects</h1>
      <div class="sub">First-time setup — choose an app password</div>
      <div class="field"><label>Password</label><input type="password" id="setup-pw" placeholder="At least 8 characters"></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="setup-pw2"></div>
      <div id="setup-error" style="color:var(--red);font-size:12.5px;margin-bottom:10px;"></div>
      <button class="btn" style="width:100%;justify-content:center;" id="setup-btn">Create Password</button>
    </div></div>`;
  document.getElementById('setup-btn').onclick = async ()=>{
    const pw = document.getElementById('setup-pw').value;
    const pw2 = document.getElementById('setup-pw2').value;
    const errEl = document.getElementById('setup-error');
    if(pw !== pw2){ errEl.textContent = 'Passwords do not match.'; return; }
    try{
      await api('/auth/setup', {method:'POST', body: JSON.stringify({password: pw})});
      await boot();
    }catch(e){ errEl.textContent = e.message; }
  };
}
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <h1>Bridge Projects</h1>
      <div class="sub">Sign in to continue</div>
      <div class="field"><label>Password</label><input type="password" id="login-pw"></div>
      <div id="login-error" style="color:var(--red);font-size:12.5px;margin-bottom:10px;"></div>
      <button class="btn" style="width:100%;justify-content:center;" id="login-btn">Sign In</button>
    </div></div>`;
  const doLogin = async ()=>{
    const pw = document.getElementById('login-pw').value;
    const errEl = document.getElementById('login-error');
    try{
      await api('/auth/login', {method:'POST', body: JSON.stringify({password: pw})});
      await boot();
    }catch(e){ errEl.textContent = e.message; }
  };
  document.getElementById('login-btn').onclick = doLogin;
  document.getElementById('login-pw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

/* ==================== Shell / nav ==================== */
function appShell(innerHTML){
  const tabs = [
    {id:'dashboard', label:'Dashboard', icon:'▦', enabled:true},
    {id:'daily', label:'Daily Reports', icon:'📋', enabled:false},
    {id:'submittals', label:'Submittals', icon:'📑', enabled:false},
    {id:'cos', label:'Change Orders', icon:'✎', enabled:false},
  ];
  return `
    <header class="topbar">
      <div class="brand"><span class="n">BRIDGE</span> ${esc(state.company.name||'Projects')}</div>
      <div class="actions">
        <button data-nav="dashboard">Dashboard</button>
        <button id="logout-btn">Sign Out</button>
      </div>
    </header>
    <main>
      <nav class="tabs">
        ${tabs.map(t=>`<div class="tab ${currentView===t.id?'active':''} ${!t.enabled?'disabled':''}" ${t.enabled?`data-nav="${t.id}"`:'title="Coming soon"'}>${t.label}${!t.enabled?' (soon)':''}</div>`).join('')}
      </nav>
      ${innerHTML}
    </main>
    <nav class="bottom-nav">
      ${tabs.map(t=>`<div class="bn-item ${currentView===t.id?'active':''}" ${t.enabled?`data-nav="${t.id}"`:'title="Coming soon"'}><span class="ic">${t.icon}</span><span>${t.label}</span></div>`).join('')}
    </nav>
  `;
}

/* ==================== Dashboard ==================== */
function laborStatusClass(pctUsed){
  if(pctUsed >= 100) return 'red';
  if(pctUsed >= 80) return 'amber';
  return 'blue';
}
function progressBar(pct, colorClass, labelLeft, labelRight){
  pct = Math.max(0, Math.min(100, pct));
  return `<div class="progress-row">
    <div class="prlabel"><span>${labelLeft}</span><strong>${labelRight}</strong></div>
    <div class="progress-track"><div class="progress-fill ${colorClass}" style="width:${pct}%;"></div></div>
  </div>`;
}
// Unified status for any milestone, whether it's a single-target type or a range (start/stop) type.
function milestoneStatus(p, m){
  if(normalizeType(m.type)==='range'){
    const rs = rangeStatus(m);
    return { remaining: rs.remaining, label: rs.label, cls: rs.cls, targetDate: new Date(m.endDate), phase: rs.phase };
  }
  const remaining = daysRemaining(p, m.type, m.value);
  return {
    remaining,
    label: `${remaining}${remaining<0?' overdue':' days'}`,
    cls: scheduleStatusClass(remaining),
    targetDate: targetEndDate(p, m.type, m.value),
    phase: remaining<0 ? 'past' : 'active',
  };
}
function projectCard(p){
  const remaining = daysRemaining(p, p.contractType, p.contractValue);
  const total = totalDuration(p, p.contractType, p.contractValue);
  const elapsed = total - remaining;
  const pctElapsed = total>0 ? (elapsed/total*100) : 0;
  const remClass = scheduleStatusClass(remaining);
  const laborBudget = Number(p.laborHoursBudget||0);
  const laborUsed = Number(p.laborHoursUsed||0);
  const pctLabor = laborBudget>0 ? (laborUsed/laborBudget*100) : 0;
  const laborClass = laborStatusClass(pctLabor);
  const nextMilestone = (p.milestones||[])
    .map(m=>({...m, status: milestoneStatus(p, m)}))
    .filter(m=>m.status.remaining >= 0)
    .sort((a,b)=>a.status.remaining-b.status.remaining)[0];

  return `<div class="proj-card" data-nav="project-detail" data-id="${p.id}">
    <div class="pnum">${esc(p.projectNumber)} <span class="tag ${p.status==='active'?'green':(p.status==='complete'?'grey':'amber')}" style="margin-left:6px;">${esc(p.status)}</span></div>
    <div class="pname">${esc(p.projectName)}</div>

    <div class="days-remaining ${remClass}">
      <div class="num">${remaining}</div>
      <div class="lbl">${scheduleTypeLabel(p.contractType)} Remaining</div>
    </div>

    ${progressBar(pctElapsed, remClass==='red'?'red':(remClass==='amber'?'amber':'green'), 'Contract Time Elapsed', `${Math.round(pctElapsed)}%`)}
    ${progressBar(pctLabor, laborClass, 'Labor Hours Used', `${laborUsed.toLocaleString()} / ${laborBudget.toLocaleString()} hrs`)}

    ${nextMilestone ? `<div class="milestone-mini">Next milestone: <strong>${esc(nextMilestone.label)}</strong> — ${nextMilestone.status.label}</div>` : ''}
  </div>`;
}
function dashboardView(){
  const projects = state.projects || [];
  return `
    <div class="dash-header">
      <h2 style="margin:0;">Projects</h2>
      <button class="btn" id="new-project-btn">+ New Project</button>
    </div>
    ${projects.length ? `<div class="proj-cards">${projects.map(projectCard).join('')}</div>` : `<div class="card">No projects yet. Click "+ New Project" to add your first bridge project.</div>`}
  `;
}

/* ==================== Project detail ==================== */
function milestoneTable(p){
  const rows = (p.milestones||[]).map(m=>{
    const s = milestoneStatus(p, m);
    const dateDisplay = normalizeType(m.type)==='range'
      ? `${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}`
      : fmtDate(s.targetDate);
    return `<tr>
      <td>${esc(m.label)}</td>
      <td>${scheduleTypeLabel(m.type)}</td>
      <td>${dateDisplay}</td>
      <td class="num"><span class="tag ${s.cls}">${s.label}</span></td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr><th>Milestone</th><th>Type</th><th>Target Date</th><th style="text-align:right;">Status</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="4" style="color:var(--steel);">No milestones added yet.</td></tr>'}</tbody>
  </table>`;
}
function projectDetailView(p){
  const remaining = daysRemaining(p, p.contractType, p.contractValue);
  const total = totalDuration(p, p.contractType, p.contractValue);
  const elapsed = total - remaining;
  const pctElapsed = total>0 ? (elapsed/total*100) : 0;
  const remClass = scheduleStatusClass(remaining);
  const end = targetEndDate(p, p.contractType, p.contractValue);
  const laborBudget = Number(p.laborHoursBudget||0);
  const laborUsed = Number(p.laborHoursUsed||0);
  const pctLabor = laborBudget>0 ? (laborUsed/laborBudget*100) : 0;
  const laborClass = laborStatusClass(pctLabor);

  return `
    <button class="btn secondary small" data-nav="dashboard" style="margin-bottom:14px;">← Back to Dashboard</button>
    <div class="dash-header">
      <div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--orange);">${esc(p.projectNumber)}</div>
        <h2 style="margin:2px 0;">${esc(p.projectName)}</h2>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn secondary small" id="edit-project-btn">Edit Project</button>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="label">${scheduleTypeLabel(p.contractType)} Remaining</div><div class="value" style="color:var(--${remClass==='red'?'red':(remClass==='amber'?'amber':'green')});">${remaining}</div></div>
      <div class="kpi"><div class="label">Contract Completion</div><div class="value" style="font-size:20px;">${fmtDate(end)}</div></div>
      <div class="kpi"><div class="label">Labor Hours Remaining</div><div class="value">${(laborBudget-laborUsed).toLocaleString()}</div></div>
      <div class="kpi"><div class="label">NTP Date</div><div class="value" style="font-size:20px;">${fmtDate(p.ntpDate)}</div></div>
      ${p.actualStartDate ? `<div class="kpi"><div class="label">Actual Start Date</div><div class="value" style="font-size:20px;">${fmtDate(p.actualStartDate)}</div></div>` : ''}
    </div>

    <div class="card">
      <h2>Schedule Progress</h2>
      ${progressBar(pctElapsed, remClass==='red'?'red':(remClass==='amber'?'amber':'green'), 'Contract Time Elapsed', `${Math.round(pctElapsed)}% (${elapsed} of ${total} ${p.contractType==='date'?'days':scheduleTypeLabel(p.contractType).toLowerCase()})`)}
    </div>

    <div class="card">
      <h2>Milestones</h2>
      ${milestoneTable(p)}
    </div>

    <div class="card">
      <h2>Labor Hours</h2>
      ${progressBar(pctLabor, laborClass, 'Hours Used', `${laborUsed.toLocaleString()} / ${laborBudget.toLocaleString()} hrs`)}
      <div class="grid cols-2" style="margin-top:14px;">
        <div class="field" style="margin-bottom:0;">
          <label>Budgeted Hours</label>
          <input type="number" id="labor-budget-input" value="${laborBudget}">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Hours Used to Date</label>
          <input type="number" id="labor-used-input" value="${laborUsed}">
        </div>
      </div>
      <div class="helptext">Update weekly. Last updated: ${p.laborHoursUpdatedDate ? fmtDate(p.laborHoursUpdatedDate) : 'never'}.</div>
      <button class="btn small" id="save-labor-btn" style="margin-top:12px;">Save Hours</button>
    </div>

    <div class="card">
      <h2>Project Info</h2>
      <div class="grid cols-2">
        <div><label>Owner</label><div>${esc(p.owner)||'—'}</div></div>
        <div><label>Location</label><div>${esc(p.location)||'—'}</div></div>
      </div>
    </div>
  `;
}

/* ==================== New/Edit Project modal ==================== */
function emptyMilestone(){ return {id: 'ms_'+Math.random().toString(36).slice(2,10), label:'', type:'date', value:'', startDate:'', endDate:''}; }
let modalMilestones = [];

function milestoneRowHTML(m, idx){
  const type = normalizeType(m.type);
  const isDate = type==='date';
  const isRange = type==='range';
  let valueCell;
  if(isRange){
    valueCell = `<div style="display:flex;gap:6px;">
      <div style="flex:1;"><label>Start Date</label><input type="date" data-ms-field="startDate" value="${esc(m.startDate||'')}"></div>
      <div style="flex:1;"><label>Stop Date</label><input type="date" data-ms-field="endDate" value="${esc(m.endDate||'')}"></div>
    </div>`;
  } else {
    valueCell = `<label>${isDate?'Date':'Days'}</label><input type="${isDate?'date':'number'}" data-ms-field="value" value="${esc(m.value||'')}">`;
  }
  return `<div class="milestone-row" data-ms-idx="${idx}">
    <div class="field" style="margin-bottom:0;"><label>Milestone Label</label><input type="text" data-ms-field="label" value="${esc(m.label)}" placeholder="e.g. Interim Completion - Deck Pour"></div>
    <div class="field" style="margin-bottom:0;"><label>Type</label>
      <select data-ms-field="type">
        <option value="date" ${type==='date'?'selected':''}>Fixed Date</option>
        <option value="calendar-ntp" ${type==='calendar-ntp'?'selected':''}>Calendar Days from NTP</option>
        <option value="working-ntp" ${type==='working-ntp'?'selected':''}>Working Days from NTP</option>
        <option value="calendar-start" ${type==='calendar-start'?'selected':''}>Calendar Days from Actual Start</option>
        <option value="working-start" ${type==='working-start'?'selected':''}>Working Days from Actual Start</option>
        <option value="range" ${type==='range'?'selected':''}>Start &amp; Stop Date</option>
      </select>
    </div>
    <div class="field" style="margin-bottom:0;">${valueCell}</div>
    <button class="btn secondary small" data-ms-remove="${idx}" type="button" style="align-self:end;">✕</button>
  </div>`;
}
function renderModalMilestones(){
  document.getElementById('milestones-list').innerHTML = modalMilestones.map(milestoneRowHTML).join('');
  wireMilestoneRowEvents();
}
function wireMilestoneRowEvents(){
  document.querySelectorAll('[data-ms-idx]').forEach(row=>{
    const idx = Number(row.getAttribute('data-ms-idx'));
    row.querySelectorAll('[data-ms-field]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        modalMilestones[idx][inp.getAttribute('data-ms-field')] = inp.value;
      });
      inp.addEventListener('change', ()=>{
        if(inp.getAttribute('data-ms-field')==='type') renderModalMilestones();
      });
    });
  });
  document.querySelectorAll('[data-ms-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modalMilestones.splice(Number(btn.getAttribute('data-ms-remove')), 1);
      renderModalMilestones();
    });
  });
}
function openProjectModal(existing){
  modalMilestones = existing ? JSON.parse(JSON.stringify(existing.milestones||[])) : [];
  const p = existing || {projectNumber:'', projectName:'', owner:'', location:'', status:'active', ntpDate:'', actualStartDate:'', contractType:'calendar-ntp', contractValue:'', laborHoursBudget:'', laborHoursUsed:''};
  const cType = normalizeType(p.contractType);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h2>${existing?'Edit Project':'New Project'}</h2>
      <div class="grid cols-2">
        <div class="field"><label>Project Number</label><input type="text" id="pf-number" value="${esc(p.projectNumber)}"></div>
        <div class="field"><label>Status</label>
          <select id="pf-status">
            <option value="active" ${p.status==='active'?'selected':''}>Active</option>
            <option value="complete" ${p.status==='complete'?'selected':''}>Complete</option>
            <option value="hold" ${p.status==='hold'?'selected':''}>On Hold</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Project Name</label><input type="text" id="pf-name" value="${esc(p.projectName)}"></div>
      <div class="grid cols-2">
        <div class="field"><label>Owner</label><input type="text" id="pf-owner" value="${esc(p.owner)}"></div>
        <div class="field"><label>Location</label><input type="text" id="pf-location" value="${esc(p.location)}"></div>
      </div>

      <h3 style="margin-top:18px;">Contract Schedule</h3>
      <div class="grid cols-2">
        <div class="field"><label>Notice to Proceed (NTP) Date</label><input type="date" id="pf-ntp" value="${esc(p.ntpDate)}"></div>
        <div class="field"><label>Actual Start Date</label><input type="date" id="pf-actual-start" value="${esc(p.actualStartDate||'')}"></div>
      </div>
      <div class="helptext" style="margin:-8px 0 14px 0;">Actual Start is optional — only needed if this contract counts days from when work actually began rather than from NTP.</div>
      <div class="field"><label>Contract Completion Type</label>
        <select id="pf-contract-type">
          <option value="calendar-ntp" ${cType==='calendar-ntp'?'selected':''}>Calendar Days from NTP</option>
          <option value="working-ntp" ${cType==='working-ntp'?'selected':''}>Working Days from NTP</option>
          <option value="calendar-start" ${cType==='calendar-start'?'selected':''}>Calendar Days from Actual Start</option>
          <option value="working-start" ${cType==='working-start'?'selected':''}>Working Days from Actual Start</option>
          <option value="date" ${cType==='date'?'selected':''}>Fixed Completion Date</option>
        </select>
      </div>
      <div class="field"><label id="pf-contract-value-label">${cType==='date'?'Completion Date':'Number of Days'}</label>
        <input type="${cType==='date'?'date':'number'}" id="pf-contract-value" value="${esc(p.contractValue)}">
      </div>

      <h3 style="margin-top:18px;">Interim Milestones</h3>
      <div id="milestones-list"></div>
      <button class="btn secondary small" id="add-milestone-btn" type="button">+ Add Milestone</button>

      <h3 style="margin-top:18px;">Labor Hours</h3>
      <div class="grid cols-2">
        <div class="field"><label>Budgeted Hours</label><input type="number" id="pf-labor-budget" value="${esc(p.laborHoursBudget)}"></div>
        <div class="field"><label>Hours Used to Date</label><input type="number" id="pf-labor-used" value="${esc(p.laborHoursUsed)}"></div>
      </div>

      <div id="pf-error" style="color:var(--red);font-size:12.5px;"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="pf-cancel">Cancel</button>
        <button class="btn" id="pf-save">${existing?'Save Changes':'Create Project'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  renderModalMilestones();

  document.getElementById('pf-contract-type').addEventListener('change', (e)=>{
    const isDate = e.target.value==='date';
    document.getElementById('pf-contract-value').type = isDate ? 'date' : 'number';
    document.getElementById('pf-contract-value-label').textContent = isDate ? 'Completion Date' : 'Number of Days';
  });
  document.getElementById('add-milestone-btn').addEventListener('click', ()=>{
    modalMilestones.push(emptyMilestone());
    renderModalMilestones();
  });
  document.getElementById('pf-cancel').addEventListener('click', ()=> backdrop.remove());
  document.getElementById('pf-save').addEventListener('click', ()=>{
    const errEl = document.getElementById('pf-error');
    const projectNumber = document.getElementById('pf-number').value.trim();
    const projectName = document.getElementById('pf-name').value.trim();
    const ntpDate = normalizeDateValue(document.getElementById('pf-ntp').value);
    const actualStartDate = normalizeDateValue(document.getElementById('pf-actual-start').value);
    const contractType = document.getElementById('pf-contract-type').value;
    let contractValue = document.getElementById('pf-contract-value').value;
    if(contractType==='date') contractValue = normalizeDateValue(contractValue);
    if(!projectNumber || !projectName){ errEl.textContent = 'Project number and name are required.'; return; }
    if(!ntpDate){ errEl.textContent = 'NTP date is required to calculate schedule.'; return; }
    if(!contractValue){ errEl.textContent = 'Contract completion value is required.'; return; }
    if((contractType==='calendar-start' || contractType==='working-start') && !actualStartDate){
      errEl.textContent = 'Actual Start Date is required for this contract completion type.'; return;
    }
    if(!yearIsSane(ntpDate)){ errEl.textContent = 'The NTP Date year looks wrong (check it reads a full 4-digit year, e.g. 2026, not 26).'; return; }
    if(!yearIsSane(actualStartDate)){ errEl.textContent = 'The Actual Start Date year looks wrong (check it reads a full 4-digit year, e.g. 2026, not 26).'; return; }
    if(contractType==='date' && !yearIsSane(contractValue)){ errEl.textContent = 'The Completion Date year looks wrong (check it reads a full 4-digit year, e.g. 2026, not 26).'; return; }
    for(const m of modalMilestones){
      if(!m.label) continue;
      const mType = normalizeType(m.type);
      if(mType==='range'){
        if(m.startDate) m.startDate = normalizeDateValue(m.startDate);
        if(m.endDate) m.endDate = normalizeDateValue(m.endDate);
        if(m.startDate && !yearIsSane(m.startDate)){ errEl.textContent = `Milestone "${m.label}": Start Date year looks wrong.`; return; }
        if(m.endDate && !yearIsSane(m.endDate)){ errEl.textContent = `Milestone "${m.label}": Stop Date year looks wrong.`; return; }
      } else if(mType==='date' && m.value){
        m.value = normalizeDateValue(m.value);
        if(!yearIsSane(m.value)){ errEl.textContent = `Milestone "${m.label}": Date year looks wrong.`; return; }
      }
    }

    const newP = {
      id: existing ? existing.id : 'proj_'+Math.random().toString(36).slice(2,10),
      projectNumber, projectName,
      owner: document.getElementById('pf-owner').value.trim(),
      location: document.getElementById('pf-location').value.trim(),
      status: document.getElementById('pf-status').value,
      ntpDate,
      actualStartDate,
      contractType,
      contractValue,
      milestones: modalMilestones.filter(m=> m.label && (normalizeType(m.type)==='range' ? (m.startDate && m.endDate) : m.value)),
      laborHoursBudget: document.getElementById('pf-labor-budget').value || 0,
      laborHoursUsed: document.getElementById('pf-labor-used').value || 0,
      laborHoursUpdatedDate: existing ? existing.laborHoursUpdatedDate : new Date().toISOString().slice(0,10),
    };
    if(existing){
      const idx = state.projects.findIndex(x=>x.id===existing.id);
      state.projects[idx] = newP;
    } else {
      state.projects.push(newP);
    }
    scheduleSave();
    backdrop.remove();
    render();
  });
}

/* ==================== Router / render ==================== */
function render(){
  let inner = '';
  if(currentView === 'dashboard'){
    inner = dashboardView();
  } else if(currentView === 'project-detail'){
    const p = state.projects.find(x=>x.id===currentProjectId);
    if(!p){ currentView='dashboard'; inner = dashboardView(); }
    else inner = projectDetailView(p);
  } else {
    inner = `<div class="card">This section is coming soon.</div>`;
  }
  document.getElementById('app').innerHTML = appShell(inner);
  wireGlobalEvents();
}
function wireGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nav = el.getAttribute('data-nav');
      const id = el.getAttribute('data-id');
      currentView = nav;
      if(nav==='project-detail' && id) currentProjectId = id;
      render();
    });
  });
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{
    await api('/auth/logout', {method:'POST'});
    location.reload();
  });
  const newBtn = document.getElementById('new-project-btn');
  if(newBtn) newBtn.addEventListener('click', ()=> openProjectModal(null));
  const editBtn = document.getElementById('edit-project-btn');
  if(editBtn) editBtn.addEventListener('click', ()=>{
    const p = state.projects.find(x=>x.id===currentProjectId);
    openProjectModal(p);
  });
  const saveLaborBtn = document.getElementById('save-labor-btn');
  if(saveLaborBtn) saveLaborBtn.addEventListener('click', ()=>{
    const p = state.projects.find(x=>x.id===currentProjectId);
    p.laborHoursBudget = document.getElementById('labor-budget-input').value || 0;
    p.laborHoursUsed = document.getElementById('labor-used-input').value || 0;
    p.laborHoursUpdatedDate = new Date().toISOString().slice(0,10);
    scheduleSave();
    render();
  });
}

/* ==================== Boot ==================== */
async function boot(){
  renderAuthLoading();
  try{
    authStatus = await api('/auth/status');
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="auth-wrap"><div class="auth-card">Could not reach the server. Please refresh.</div></div>`;
    return;
  }
  if(authStatus.needsSetup){ renderSetup(); return; }
  if(!authStatus.authenticated){ renderLogin(); return; }
  await loadState();
  render();
}
boot();
</script>
</body>
</html>
